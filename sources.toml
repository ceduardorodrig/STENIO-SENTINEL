# ============================================================================
# kururu — Alpine ARM probe: NO Docker, NO systemd. Observation of a systemd
# unit would be meaningless, so the node is intentionally left without a source
# (the catalogue's kururu declarations are therefore not stale-checked).
# ============================================================================

# ── Socket observation (documented, disabled) ───────────────────────────────
# `ss` yields process names (`docker-proxy`, `systemd-resolved`, …) that do not
# map 1:1 to catalogue service names, so a socket source would produce false
# positives. It is shipped DISABLED as the template for a host whose sockets are
# worth reconciling. Enable per host when a reliable name mapping exists.
[[source]]
host = "psicopompo"
transport = "local"
parser = "ss_processes"
enabled = false
command = "ss -Htlpn"
