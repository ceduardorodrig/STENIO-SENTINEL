name: Release — StenioSentinel

# Publica o binário do motor como release, para que os repositórios consumidores
# NÃO precisem compilar Rust.
#
# POR QUE EXISTE (29/09/2026): cada repo que usava o Stênio tinha que clonar o
# código do motor e rodar `cargo build --release` — o que quebrava sempre que o
# caminho do motor mudava (foi o que derrubou o CI do CV: ele ainda compilava
# `sumaenima-hub/scripts/steniocheck-rs`, purgado em 70d7132). Com o binário
# publicado, o consumidor só baixa e executa: CI em segundos, uma única fonte de
# verdade, e a atualização do motor é só uma tag nova aqui.
#
# Consumo (ver .github/actions/stenio-check/action.yml):
#   uses: ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check@v1
#
# O repositório é PÚBLICO, então o download do asset não exige token.
# Disparo: push de tag `v*` (ex.: `git tag -a v3.1.0 -m "..." && git push --follow-tags`).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # necessário para criar a release e anexar o asset

jobs:
  release:
    name: Build & Publish Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # O binário é validado ANTES de ser publicado: uma release com motor
      # defeituoso contaminaria todos os repos consumidores de uma vez.
      - name: Build Release
        run: cargo build --release

      - name: Self-Tests (17/17)
        run: ./target/release/stenio --self-test

      - name: Cryptographic Guardian (anti-tampering)
        run: ./target/release/stenio --guardian

      # Renomeia para um nome estável: o consumidor depende do NOME do asset,
      # não da versão, então a action não precisa saber qual tag está pegando.
      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/stenio dist/stenio
          chmod +x dist/stenio
          # Checksum para o consumidor verificar a integridade do download.
          (cd dist && sha256sum stenio > stenio.sha256)
          ls -la dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/stenio
            dist/stenio.sha256
          generate_release_notes: true
          # `make_latest` explícito: sem isto, a resolução de "latest" fica
          # dependente do default da API e da ordem de publicação — foi assim
          # que duas releases `v3.8.0` (uma draft, uma publicada) apareceram em
          # 29/09/2026. A action baixa o binário de `releases/latest`, então
          # este campo NÃO é cosmético.
          make_latest: true
          # `overwrite_files` é o default (true), então re-publicar a mesma tag
          # substitui o asset em vez de falhar com 422 (comportamento da API de
          # release assets quando o nome já existe).

      # ── Trilha major flutuante (`v1`) ────────────────────────────────────
      # Mantém a tag major apontando para a release recém-publicada. Sem este
      # step a tag ficava congelada no commit em que foi criada: em 29/09/2026
      # ela estava 8 commits atrás da `main`, e o `action.yml` servido aos
      # consumidores era o antigo.
      #
      # É a prática oficial do GitHub para actions:
      #   "keeping major (v1) and minor (v1.1) tags current to the latest
      #    appropriate commit" — docs/en/actions/how-tos/.../release-and-maintain-actions
      #
      # POR QUE SÓ A MAJOR (e não também a minor): os 9 consumidores usam `@v1`.
      # Uma tag `v1.3` seria garantia que ninguém pediu — complexidade sem uso.
      # Adicionar a minor depois é aditivo, não quebra nada.
      #
      # POR QUE `git` PURO (e não uma action de terceiros): mover a tag é
      # `git tag -f` + push. Uma dependência externa aqui seria mais superfície
      # de ataque no ponto que publica o binário executado por todos os CIs.
      #
      # ⚠️ Isto é um force-push de tag. A tag `v1` é uma TRILHA MÓVEL por
      # definição — quem consome `@v1` quer receber a versão nova. Quem precisa
      # de imutabilidade usa `@v3.8.1` (`with: version: v3.8.1`).
      - name: Move major tag (v1) to this release
        shell: bash
        run: |
          set -euo pipefail
          MAJOR_TAG="v${GITHUB_REF_NAME#v}"   # v3.8.2 -> v3
          MAJOR_TAG="${MAJOR_TAG%%.*}"        # v3
          echo "🛡️ Movendo a trilha flutuante '$MAJOR_TAG' para $GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$MAJOR_TAG" -m "Major track: aponta para $GITHUB_REF_NAME"
          git push -f origin "refs/tags/$MAJOR_TAG"
          echo "✅ $MAJOR_TAG → $GITHUB_REF_NAME ($(git rev-parse --short HEAD))"
