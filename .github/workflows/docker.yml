name: Docker OCI — StenioSentinel (GHCR)

# Builds and publishes multi-tag OCI container images of StenioSentinel to GitHub Packages (ghcr.io).
# Enables zero-drift deployment across Homelab nodes (Kuaray, Psicopompo) and Miracena stack.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # The image is built (never pushed) on a pull request: 4.59.0 reached a tag with a source
  # the container build could not compile.
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push OCI Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
