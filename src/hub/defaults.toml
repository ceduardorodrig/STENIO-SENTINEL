# Central declaration of the shared work ledger. This copy is embedded in the engine; a host
# overrides it with the file named by STENIO_HUB_CONFIG, or with
# $XDG_CONFIG_HOME/stenio/hub.toml (default ~/.config/stenio/hub.toml). An override replaces
# the whole file, so copy every section.

[lease]
default_ttl_secs = 1200
max_ttl_secs = 86400
# A hook heartbeat younger than this is not repeated.
hook_beat_min_secs = 60

[fleet]
# Ceiling of fleet:slot claims when no run declares fewer.
ceiling = 5

[quota]
# A sample older than this is "stale" and no longer proves there is room.
fresh_secs = 300
# Owner policy, 2026-11-28: "eu quero usar 100%, e isso deve estar previsto". New work is
# refused only when a window is exhausted, that is when its source reports `stop_percent`.
stop_percent = 100.0
# From this percentage every claim answers with a warning: checkpoint, and do not start a
# release or rollout that cannot be finished.
advisory_percent = 80.0
# At `throttle_percent` at most `throttle_workers` workers of one account hold work; an account
# whose quota is unknown or stale allows `unknown_workers`. Both are the fleet ceiling, so only
# exhaustion refuses.
throttle_percent = 100.0
throttle_workers = 5
unknown_workers = 5
# A `[[quota.limit]]` entry narrows `stop_percent` or `advisory_percent` for one account, or one
# window of it: account = "anthropic", window = "Current week", stop_percent = 90.0
resume_margin_secs = 120
command_timeout_secs = 30

# Quota account of a harness that joins without --account. Unlisted harnesses use their own name.
# A claim of new work reads the account's source first when no fresh sample exists.
[accounts]
claude-code = "anthropic"
opencode = "opencode-go"

# How many attempts a row gets (a lease left to expire or a `failed` hand-back). Over the limit a
# claim is refused until the owner resets the row.
[attempts]
limit = 3

# The harness session id: variables its shell commands see, and fields of its hook payloads.
# `join` binds the worker to it, so `beat --from-hook` and `guard` need no exported worker id.
# A harness listed in [session.harness] binds through its own variable only (a harness started
# from another harness's shell inherits that one's variables); any other tries `env` in order.
[session]
env = ["CLAUDE_CODE_SESSION_ID", "HERMES_SESSION_ID", "OPENCODE_SESSION_ID", "ANTIGRAVITY_CONVERSATION_ID"]
fields = ["session_id", "sessionId", "conversationId"]
# Names the sub-agent in a hook payload (sub-agents share the session id).
agent_fields = ["agent_id"]

[session.harness]
claude-code = "CLAUDE_CODE_SESSION_ID"
hermes = "HERMES_SESSION_ID"
opencode = "OPENCODE_SESSION_ID"
antigravity = "ANTIGRAVITY_CONVERSATION_ID"
agy = "ANTIGRAVITY_CONVERSATION_ID"

[backup]
# `hub status` and `hub backup --check` report a ledger backup older than this.
max_age_secs = 93600

# Read-only commands that report account limits. Stenio never reads key files.
[[quota.source]]
account = "anthropic"
command = ["hermes", "usage", "--provider", "anthropic", "--json"]

[[quota.source]]
account = "opencode-go"
command = ["hermes", "usage", "--provider", "opencode-go", "--json"]
