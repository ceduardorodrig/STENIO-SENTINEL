[package]
name = "stenio-sentinel"
version = "3.0.0"
edition = "2021"
description = "Universal Governance & Homelab Sentinel in Rust"

[[bin]]
name = "stenio"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
ignore = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
colored = "2.1"
anyhow = "1.0"
chrono = "0.4"
toml = "0.8"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "time", "macros"] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

